name: Issue 499 validation workspace
on:
  push:
    branches: [work/499-cloud-options-validation]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: issue-499
          cache-on-failure: true
      - uses: actions/cache@v4
        id: bolt
        with:
          path: ~/.cargo/bin/boltffi
          key: issue-499-boltffi-0.30.1-${{ runner.os }}
      - name: Install pinned binding generator
        if: steps.bolt.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version 0.30.1 --locked
      - name: Upstream facade and Bolt tests
        run: cargo test -p xybrid-ffi-facade -p xybrid-bolt --lib
