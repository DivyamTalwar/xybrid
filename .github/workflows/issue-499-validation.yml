name: Issue 499 validation workspace

on:
  push:
    branches: [work/499-cloud-options-validation]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Package tracked source for review
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/issue-499-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink() or path.stat().st_size > 2_000_000:
                      continue
                  try:
                      path.read_text(encoding='utf-8')
                  except (UnicodeError, OSError):
                      continue
                  archive.write(path, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-499-source
          path: /tmp/issue-499-source.zip
          retention-days: 3
